<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#e9dcc8"><link rel="manifest" href="manifest.webmanifest"><link rel="icon" href="icon.svg" type="image/svg+xml"><title>Totoro — Mon compagnon</title><link rel="stylesheet" href="style.css"></head><body><main><header><div><strong>Totoro</strong><small id="status">Mon petit compagnon</small></div><div class="topright"><span id="clock">--:--</span><button id="settings" aria-label="Paramètres">⚙</button></div></header><section class="world"><canvas id="scene" width="480" height="320" aria-label="Totoro dans son petit monde"></canvas><div class="toast" id="toast"></div></section><section class="toolbar"><button data-act="pet">❤️ Câlin</button><button data-act="feed">🥣 Repas</button><button data-act="play">🧶 Jouer</button><button data-act="rest">💤 Repos</button></section><nav><button data-place="room" class="active">🏠 Son coin</button><button data-place="sofa">🛋️ Canapé</button><button data-place="garden">🌳 Pommier</button></nav><section class="stats"><div>Faim <meter id="hunger" min="0" max="100" value="80"></meter></div><div>Énergie <meter id="energy" min="0" max="100" value="75"></meter></div><div>Bonheur <meter id="joy" min="0" max="100" value="90"></meter></div></section><footer>Il est toujours là. ♥ <span id="stage"></span></footer></main><dialog id="panel"><h2>Paramètres</h2><label>Nom du lieu <input id="locationName" placeholder="Maison ou travail"></label><label>Ville météo <input id="city" placeholder="Courrières"></label><label>Durée de veille écran (secondes) <input id="idle" type="number" min="30" max="3600"></label><label><input id="mute" type="checkbox"> Mode silencieux</label><p class="hint">La météo en ligne est optionnelle. L'application reste jouable hors connexion. Les données restent sur cet appareil.</p><div class="actions"><button id="export">Exporter sauvegarde</button><button id="import">Importer sauvegarde</button><input type="file" id="file" accept="application/json" hidden><button id="close">Fermer</button></div></dialog><div id="sleepOverlay" hidden><span>🌙 Totoro se repose</span><button id="wake">Réveiller l'écran</button></div><script src="app.js"></script></body></html>
